# Daily data update and deploy (ETFRegulus WEBAPP_PLAN.md §1, §4, Step 5).
#
# After each US market close: fetch prices, curate, run every strategy x ceiling with the
# ETFRegulus code pinned in ETFREGULUS_REF, check the output against the data contract, append
# the live log, and deploy the app with the new data to GitHub Pages. If any step fails,
# nothing is deployed and the site keeps the previous data (the app shows it as overdue).
name: Daily update

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC = 18:30 EDT / 17:30 EST, after the 16:00 ET close (cron is UTC-only)
    - cron: "30 2 * * 2-6"    # 22:30 EDT / 21:30 EST: second attempt, in case the first one failed or the data was late
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/daily.yml", "ETFREGULUS_REF"]

permissions:
  contents: write     # commit the live log
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Front-end unit tests
        run: node --test tests/*.test.js

      - name: Pinned ETFRegulus version
        id: ref
        run: echo "ref=$(tr -d '[:space:]' < ETFREGULUS_REF)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: znzhao/ETFRegulus
          ref: ${{ steps.ref.outputs.ref }}
          path: engine

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements-publish.txt

      - name: Install
        run: pip install -r engine/requirements-publish.txt

      - name: Fetch prices and FRED macro (Stage 1)
        # The RL model reads macro features, so FRED is fetched too (secret FRED_API_KEY).
        working-directory: engine
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            python -m scripts.s01_fetch_data && break
            echo "fetch failed (attempt $attempt), retrying in 60s"; sleep 60
            [ "$attempt" = 3 ] && exit 1
          done

      - name: Trim to the last session every symbol has
        # Right after the close Yahoo sometimes has today's bar for most ETFs but not all
        # (seen with XLC and XLRE), which Stage 2 rejects as a gap. Drop that partial day;
        # the next run picks it up.
        working-directory: engine
        run: |
          python - <<'PY'
          import glob, pandas as pd
          files = glob.glob("data/raw/prices/*.parquet")
          frames = {f: pd.read_parquet(f) for f in files}
          # A run during market hours (a manual or push-triggered one) sees today's bar
          # still forming; drop it until 16:30 ET.
          now = pd.Timestamp.now(tz="America/New_York")
          if now.hour * 60 + now.minute < 16 * 60 + 30:
              today = pd.Timestamp(now.date())
              for f, d in frames.items():
                  if (d.index >= today).any():
                      frames[f] = d[d.index < today]
                      frames[f].to_parquet(f)
                      print(f"dropped today's unfinished bar from {f}")
          last = {f: d.index.max() for f, d in frames.items()}
          common, newest = min(last.values()), max(last.values())
          if newest - common > pd.Timedelta(days=5):
              print(f"not trimming: latest dates span {common.date()}..{newest.date()}")
          else:
              for f, d in frames.items():
                  if last[f] > common:
                      d[d.index <= common].to_parquet(f)
                      print(f"trimmed {f} to {common.date()}")
          PY

      - name: Curate (Stage 2)
        working-directory: engine
        run: python -m scripts.s02_curate_data

      - name: Features (Stage 3)
        working-directory: engine
        run: python -m scripts.s03_build_features --fold 2025

      - name: Build site data (Stage 15)
        working-directory: engine
        run: python -m scripts.s15_publish --out ../_site/data --log-dir ../log

      - name: Commit live log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add log
          if ! git diff --cached --quiet; then
            git commit -m "Live log: $(jq -r .data_date _site/data/manifest.json)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Assemble site
        run: cp -r app/. _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
