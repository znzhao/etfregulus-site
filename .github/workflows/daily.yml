# Daily data update and deploy (ETFRegulus WEBAPP_PLAN.md §1, §4, Step 5).
#
# After each US market close: fetch prices, curate, run every strategy x ceiling with the
# ETFRegulus code pinned in ETFREGULUS_REF, check the output against the data contract, append
# the live log, and deploy the app with the new data to GitHub Pages. If any step fails,
# nothing is deployed and the site keeps the previous data (the app shows it as overdue).
name: Daily update

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC, after the close in both EDT and EST
    - cron: "30 2 * * 2-6"    # second attempt, in case the first one failed or the data was late
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/daily.yml", "ETFREGULUS_REF"]

permissions:
  contents: write     # commit the live log
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Front-end unit tests
        run: node --test tests/

      - name: Pinned ETFRegulus version
        id: ref
        run: echo "ref=$(tr -d '[:space:]' < ETFREGULUS_REF)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: znzhao/ETFRegulus
          ref: ${{ steps.ref.outputs.ref }}
          path: engine

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements-publish.txt

      - name: Install
        run: pip install -r engine/requirements-publish.txt

      - name: Fetch prices (Stage 1)
        working-directory: engine
        run: |
          for attempt in 1 2 3; do
            python -m scripts.s01_fetch_data --skip-fred && break
            echo "fetch failed (attempt $attempt), retrying in 60s"; sleep 60
            [ "$attempt" = 3 ] && exit 1
          done

      - name: Curate (Stage 2)
        working-directory: engine
        run: python -m scripts.s02_curate_data --allow-missing-macro

      - name: Build site data (Stage 15)
        working-directory: engine
        run: python -m scripts.s15_publish --out ../_site/data --log-dir ../log

      - name: Commit live log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add log
          if ! git diff --cached --quiet; then
            git commit -m "Live log: $(jq -r .data_date _site/data/manifest.json)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Assemble site
        run: cp -r app/. _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
